<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ACM NMIMS Indore</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect script
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var pathSegmentsToKeep = l.pathname.toLowerCase().startsWith('/acm-26') ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.host + (l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')) + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to ACM NMIMS Indore...</p>
  </body>
</html>
